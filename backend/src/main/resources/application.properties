# CONFIGURACIÓN DE CONEXIÓN A MYSQL (REQ6)
spring.datasource.url=jdbc:mysql://localhost:3306/petshop_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234

# DRIVER CORRECTO PARA MYSQL (Esto soluciona el error actual)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURACIÓN DE HIBERNATE PARA CREACIÓN AUTOMÁTICA (REQ7)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ESTÁNDAR SPRING BOOT PARA CARGA DE DATOS DML (REQ5)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true